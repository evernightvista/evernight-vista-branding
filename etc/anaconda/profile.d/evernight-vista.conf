# Anaconda configuration file for Evernight Vista.

[Profile]
# Define the profile.
profile_id = evernight-vista
base_profile = fedora

[Profile Detection]
# Match os-release values.
os_id = evernight

[Payload]
default_environment = kde-desktop-environment

[Bootloader]
menu_auto_hide = False

[User Interface]
hidden_spokes =
    NetworkSpoke
    PasswordSpoke
    UserSpoke
# Live spin default browser for the Web UI.
webui_web_engine = slitherer
hidden_webui_pages =
    anaconda-screen-accounts
    anaconda-screen-date-time
    anaconda-screen-network
